name: Wayland desktop packages

on:
  push:
    tags: ['wayland-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (X.Y.Z-wayland.N)'
        required: true
        default: '6.7.135-wayland.1'
        type: string
      tfm:
        description: 'Consumer desktop TFM'
        default: net9.0
        type: choice
        options: [net9.0, net10.0]

permissions:
  contents: read

jobs:
  packages:
    if: github.repository == 'MemerGamer/uno'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Select version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/wayland-v* ]]; then
            version=${GITHUB_REF_NAME#wayland-v}
          else
            version=$INPUT_VERSION
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-wayland\.[0-9]+$ ]] || exit 2
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build desktop packages
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          DESKTOP_TFM: ${{ inputs.tfm || 'net9.0' }}
        run: |
          build/wayland/build-local-packages.sh --strict \
            --version "$PACKAGE_VERSION" --tfm "$DESKTOP_TFM" \
            --feed "$RUNNER_TEMP/wayland-feed"
      - uses: actions/upload-artifact@v4
        with:
          name: wayland-packages-${{ steps.version.outputs.value }}-${{ inputs.tfm || 'net9.0' }}
          path: ${{ runner.temp }}/wayland-feed/*.nupkg
          if-no-files-found: error
          retention-days: 30
      # Enable the repository variable WAYLAND_PUBLISH_PACKAGES=true to publish tag builds.
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/wayland-v') && vars.WAYLAND_PUBLISH_PACKAGES == 'true'
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in "$RUNNER_TEMP/wayland-feed"/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://nuget.pkg.github.com/MemerGamer/index.json \
              --api-key "$NUGET_AUTH_TOKEN" --skip-duplicate
          done
